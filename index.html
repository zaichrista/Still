<style>
:root{
  --base:#f1e9dd;--raised:#fbf7f0;--sunk:#e7dccb;--text:#2b2521;--muted:#5e534a;--faint:#6f6258;
  --border:#d9cdbd;--border-strong:#8f8173;
  --green:#2f5d46;--on-green:#f6f1e7;--green-text:#2a5440;--green-tint:#d3e0cb;--green-on-tint:#1f4030;
  --clay:#a8473a;--on-clay:#fbf1ec;--clay-tint:#f0d3c8;--clay-on-tint:#6b2b22;
  --blue:#4a6d87;--on-blue:#f4f6f7;--blue-text:#3a5a72;--blue-tint:#d0dde6;--blue-on-tint:#2a4356;
  --haven:#3b5a74;--on-haven:#f4efe6;
  --gutter:max(24px,calc((100vw - 520px)/2));
  --font:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="night"]{
  --base:#1e1a17;--raised:#2a2420;--sunk:#161210;--text:#f0e8dc;--muted:#bcb0a2;--faint:#a79b8d;
  --border:#3a322c;--border-strong:#7a6e62;
  --green:#8cbf9f;--on-green:#12241a;--green-text:#a5d1b5;--green-tint:#2b4234;--green-on-tint:#c4e2d0;
  --clay:#e08a79;--on-clay:#2b1411;--clay-tint:#4a2b26;--clay-on-tint:#f3c3b8;
  --blue:#8fb2cc;--on-blue:#10202c;--blue-text:#a9c6dc;--blue-tint:#2a3b49;--blue-on-tint:#c5dbec;
  --haven:#223445;--on-haven:#eef0ea;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--base);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-size:inherit;margin:0}
[data-act]{touch-action:manipulation;-webkit-touch-callout:none}
:focus-visible{outline:2px solid var(--green-text);outline-offset:2px}
#app{position:relative;width:100%;height:100vh;height:-webkit-fill-available;height:100dvh;margin:0;overflow:hidden;background:var(--base)}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 56px) max(var(--gutter),env(safe-area-inset-right)) 120px max(var(--gutter),env(safe-area-inset-left));display:flex;flex-direction:column}
.screen.full{padding-bottom:calc(env(safe-area-inset-bottom) + 32px)}
.screen.haven{background:var(--haven);color:var(--on-haven)}
.screen.green{background:var(--green);color:var(--on-green)}
.screen.rose{background:var(--clay-tint);color:var(--clay-on-tint)}
.haven .lg,.green .lg,.rose .lg,.haven .cap{color:inherit;opacity:.9}
.haven .btn,.green .btn{background:var(--on-haven);color:var(--haven)}
.green .btn{background:var(--on-green);color:var(--green)}
.haven .btn.ghost,.green .btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.haven .link,.green .link{color:inherit;opacity:.85}
.rose .btn.ghost{color:var(--clay-on-tint);border-color:var(--clay-on-tint)}
h1{margin:0;font-weight:600;font-size:32px;line-height:38px;letter-spacing:-.01em}
h1.display{font-size:56px;line-height:58px;font-weight:600;color:var(--green-text);letter-spacing:-.02em}
h1.statement{font-size:40px;line-height:46px;font-weight:400;letter-spacing:-.01em}
h2{margin:0;font-size:22px;line-height:28px;font-weight:600}
p{margin:0}
.lg{font-size:18px;line-height:28px;color:var(--muted)}
.label{font-size:15px;line-height:20px;font-weight:600}
.cap{font-size:13px;line-height:18px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}.g32{gap:32px}
.grow{flex:1}
.center{text-align:center;align-items:center}
.card{background:var(--raised);border-radius:24px;padding:20px;min-width:0}
.card.blue{background:var(--blue-tint);color:var(--blue-on-tint)}
.card.greenc{background:var(--green);color:var(--on-green)}
.card.clayc{background:var(--clay-tint);color:var(--clay-on-tint)}
.row{display:flex;align-items:center;gap:16px}
.btn{min-height:56px;border:0;border-radius:999px;background:var(--green);color:var(--on-green);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 24px;width:100%;text-decoration:none}
.btn.big{min-height:68px;font-size:19px;background:var(--clay);color:var(--on-clay)}
.btn.ghost{background:transparent;color:var(--green-text);border:1.5px solid var(--border-strong)}
.btn.clay{background:var(--clay);color:var(--on-clay)}
.btn.small{min-height:48px;width:auto;font-size:15px;padding:0 20px}
.link{min-height:48px;background:none;border:0;color:var(--muted);font-size:15px;font-weight:600;width:100%}
.link.danger{color:var(--clay)}
.opt{min-height:64px;border-radius:16px;border:0;font-size:16px;font-weight:600;padding:0 16px}
.opt[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--text)}
textarea{display:block;width:100%;min-height:160px;resize:none;-webkit-appearance:none;appearance:none;border-radius:20px;border:0;background:var(--raised);font-size:17px;line-height:26px;padding:18px}
textarea::placeholder{color:var(--faint)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(88px + env(safe-area-inset-bottom));padding:0 max(8px,calc(var(--gutter) - 16px)) calc(12px + env(safe-area-inset-bottom));background:var(--raised);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;justify-items:center}
.tab{min-width:48px;min-height:48px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--faint);font-size:13px;line-height:18px;font-weight:500}
.tab.on{color:var(--green-text);font-weight:600}
.pausedisc{width:56px;height:56px;border-radius:999px;background:var(--clay);color:var(--on-clay);border:4px solid var(--raised);box-sizing:content-box;display:flex;align-items:center;justify-content:center;margin-top:-22px}
.dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));justify-items:center;gap:14px 8px}
.dot{width:28px;height:28px;border-radius:999px;background:var(--sunk)}
.dot.held{background:var(--green)}
.dot.today{background:var(--raised);box-shadow:inset 0 0 0 3px var(--blue)}
.dot.today.held{background:var(--green);box-shadow:0 0 0 3px var(--base),0 0 0 5px var(--blue)}
.dot.slip{background:var(--clay)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));justify-items:center;row-gap:4px}
.cell{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--faint)}
.cell.held{background:var(--green);color:var(--on-green);font-weight:600}
.cell.slip{background:var(--clay);color:var(--on-clay);font-weight:600}
.cell.today{box-shadow:0 0 0 3px var(--raised),0 0 0 5px var(--blue);font-weight:700}
.iconbtn{width:48px;height:48px;border:0;border-radius:999px;background:none;color:var(--green-text);display:flex;align-items:center;justify-content:center}
.iconbtn:disabled{opacity:.3}
.discmark{width:56px;height:56px;border-radius:999px;background:var(--clay);color:var(--on-clay);display:flex;align-items:center;justify-content:center}
.group{background:var(--raised);border-radius:16px;overflow:hidden}
.ri{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-bottom:1px solid var(--border);font-size:16px;font-weight:500;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.ri:last-child{border-bottom:0}
.ri .v{color:var(--muted);font-weight:500;font-size:15px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{min-height:42px;padding:0 14px;border:0;border-radius:999px;background:none;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.ri input[type=date]{-webkit-appearance:none;appearance:none;width:150px;min-width:0;height:44px;border:0;border-radius:12px;background:var(--sunk);font-size:16px;padding:0 10px;text-align:center;-webkit-text-fill-color:currentColor}
.ri input[type=date]::-webkit-date-and-time-value{text-align:center;min-height:1.2em}
.sheetbg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(30,24,20,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--raised);border-radius:32px 32px 0 0;padding:32px 24px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:16px}
.toast{position:absolute;left:max(24px,calc((100% - 480px)/2));right:max(24px,calc((100% - 480px)/2));bottom:104px;background:var(--text);color:var(--base);border-radius:16px;padding:14px 18px;font-size:15px;line-height:22px;z-index:6;text-align:center}
.ring{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:999px;border:2px solid var(--on-haven);opacity:.18;transform:scale(.62)}
.bdisc{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:999px;background:var(--on-haven);transform:scale(.55)}
.entry{border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-in-out forwards}
.g{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.8,.3,1) forwards}
.fade{opacity:0;animation:rise 1.2s ease-out forwards}
.shake{animation:shake .3s}
.key{width:76px;height:76px;border-radius:999px;border:0;background:var(--raised);font-size:24px;font-weight:500}
.pin{width:14px;height:14px;border-radius:999px;background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.pin.on{background:var(--green);box-shadow:none}
.tgrid{flex:1;display:flex;flex-direction:column}
.tl{display:flex;flex-direction:column}
.tr{margin-top:auto;padding-top:24px;display:flex;flex-direction:column}
.dgrid{display:flex;flex-direction:column}
.ngrid{display:flex;flex-direction:column}
.alts{display:none}
.altq{min-height:56px;border:0;border-radius:16px;background:var(--raised);font-size:16px;font-weight:500;line-height:22px;padding:14px 18px;text-align:left}
.phead{max-width:290px}
.bwrap{position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center}
@media (min-width:900px){
  :root{--gutter:72px}
  .screen{padding-bottom:136px}
  .screen.full{padding-bottom:56px}
  .tabs{height:calc(92px + env(safe-area-inset-bottom));padding:0 72px env(safe-area-inset-bottom)}
  .tab{min-height:60px;font-size:16px;line-height:22px;gap:5px}
  .tab svg{width:28px;height:28px}
  .pausedisc{width:60px;height:60px;margin-top:-24px}
  .pausedisc svg{width:28px;height:28px}
  h1{font-size:44px;line-height:50px}
  h1.display{font-size:104px;line-height:104px}
  h1.statement{font-size:56px;line-height:62px}
  .lg{font-size:20px;line-height:30px}
  .v-settings>*,.v-checkin>*{max-width:760px}
  .v-settings>*{width:100%;margin-left:auto!important;margin-right:auto!important}
  /* today */
  .tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px}
  .tl{min-height:0}
  .tl .dots{max-width:520px}
  .tsp{flex:1;min-height:32px}
  .tl .card{max-width:520px}
  .tr{margin:0;padding:0;align-items:center;justify-content:center;flex-direction:column;gap:32px}
  .tr .btn.big{width:min(400px,46vh);height:min(400px,46vh);min-height:0;border-radius:50%;flex-direction:column;font-size:28px;gap:18px;padding:0}
  .tr .btn.big svg{width:72px;height:72px}
  .tr .link{width:auto;padding:0 28px;font-size:18px}
  /* days */
  .dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);grid-template-areas:"a b" "c b" "d b";grid-template-rows:auto auto 1fr;gap:44px 40px;margin-top:24px;align-items:start}
  .dgrid>*{margin-top:0!important}
  .da{grid-area:a}.db{grid-area:b;padding:24px 28px 32px!important}.dc{grid-area:c}.dd{grid-area:d;text-align:left!important}
  .da p{font-size:30px!important;line-height:38px!important}
  .cal{row-gap:10px}
  .cell{width:58px;height:58px;font-size:18px}
  .db .iconbtn{width:56px;height:56px}
  /* notes */
  .ngrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:48px;align-items:start;margin-top:8px}
  .nr>.col:first-child{margin-top:20px!important}
  .anotherq{display:none}
  .alts{display:flex;margin-top:20px}
  .altq{transition:filter .15s}
  textarea{min-height:300px}
  /* pause */
  .phead{max-width:760px}
  .bwrap{width:min(320px,34vh);height:min(320px,34vh)}
  #blabel{font-size:38px!important;line-height:46px!important}
  #bcount{font-size:24px!important}
  .pfoot{align-self:center;width:380px}
}
@media (min-width:900px) and (hover:hover){.altq:hover{filter:brightness(.96)}}
@media (hover:hover) and (pointer:fine){.btn:hover,.opt:hover,.key:hover{filter:brightness(.96)}.link:hover,.tab:hover,.iconbtn:hover{opacity:.8}.ri:hover{background:var(--sunk)}}
@media (prefers-reduced-motion:reduce){.d{animation:none;stroke-dashoffset:0}.g{animation:none;opacity:1}.fade{animation:none;opacity:1}}
</style>

"use strict";

/* ---------- state ---------- */
function fresh() { return { start: today(), slips: [], checkins: {}, urges: [], notes: [], settings: { theme: 'day', pin: null, sound: true } }; }
function load() {
  try { var raw = localStorage.getItem(KEY); if (raw) { var s = JSON.parse(raw); var f = fresh(); s.settings = Object.assign(f.settings, s.settings || {}); return Object.assign(f, s); } } catch (e) {}
  return fresh();
}

save();

function runStart() { return S.slips.length ? S.slips[S.slips.length - 1] : S.start; }

  var pts = [S.start].concat(S.slips.filter(function (s) { return s > S.start; })), runs = [];

  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (deferredInstall) return '<button class="ri" data-act="install">Add to home screen<span class="v">Install</span></button>';
  return '<div class="ri" style="display:block;padding:14px 16px;font-size:15px;line-height:22px"><span class="muted">' + (ios ? 'To keep Still on your home screen, tap Share in Safari, then Add to Home Screen. Do it before you start, as the home screen copy keeps its own data.' : 'To keep Still on your home screen, use your browser menu and choose Install app. Do it before you start, as the installed copy keeps its own data.') + '</span></div>';
}
var deferredInstall = null;
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; if (view === 'settings') render(); });
V.settings = function () {
  var th = S.settings.theme, snd = S.settings.sound;
  function seg(act, cur, items) { return '<div class="seg" role="group">' + items.map(function (i) { return '<button data-act="' + act + '" data-v="' + i[0] + '" aria-pressed="' + (cur === i[0]) + '">' + i[1] + '</button>'; }).join('') + '</div>'; }
  return '<h1>Settings</h1>' +
    '<div class="group" style="margin-top:20px">' +
    '<div class="ri"><span>Appearance</span>' + seg('theme', th, [['day', 'Day'], ['night', 'Night'], ['auto', 'Auto']]) + '</div>' +
    '<div class="ri"><span>Breathing sounds</span>' + seg('snd', snd ? 'on' : 'off', [['on', 'On'], ['off', 'Off']]) + '</div>' +
    '<button class="ri" data-act="' + (S.settings.pin ? 'rmpin' : 'setpin') + '"><span>Code to open</span><span class="v">' + (S.settings.pin ? 'On, tap to remove' : 'Off') + '</span></button>' +
    '<div class="ri"><label for="st">This run began</label><input id="st" type="date" value="' + runStart() + '" max="' + today() + '" data-act-change="startdate"></div></div>' +
    '<div class="group" style="margin-top:16px"><button class="ri" data-act="export"><span>Save a copy</span><span class="v">JSON</span></button>' +
    '<button class="ri" style="color:var(--clay)" data-act="eraseask"><span>Erase everything</span></button></div>' +
    (installRow() ? '<div class="group" style="margin-top:16px">' + installRow() + '</div>' : '') +
    '<p class="cap" style="margin:20px 8px 0;line-height:20px">Everything lives on this phone and nowhere else. The name on your home screen is just Still. For a reminder, make a repeating one in your phone\'s own Reminders and call it anything plain. The code is a light lock, not encryption.</p>';
};

function sheetHtml() {
  if (!T.sheet) return '';
  var body;
  if (T.sheet === 'slip') body = '<h2>Record a slip?</h2><p class="lg" style="font-size:16px;line-height:24px">Your run starts again from day one. The days before still count, and they stay in your history.</p><button class="btn clay" data-act="slipdo">Record it</button><button class="link" data-act="closesheet">Not now</button>';
  else body = '<h2>Erase everything?</h2><p class="lg" style="font-size:16px;line-height:24px">Your days and notes will be removed from this phone. This cannot be undone.</p><button class="btn clay" data-act="erasedo">Erase</button><button class="link" data-act="closesheet">Keep it</button>';
  return '<div class="sheetbg" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true">' + body + '</div></div>';
}

/* ---------- render ---------- */
function render() {
  applyTheme();
  var full = FULL[view], cls = view === 'pause' ? 'haven' : view === 'passed' ? 'green' : view === 'slip' ? 'rose' : '';
  var keep = ($('#screen') || {}).scrollTop || 0;
  $('#app').innerHTML = '<main class="screen ' + (full ? 'full ' : '') + cls + ' v-' + view + '" id="screen">' + V[view]() + '</main>' + (full ? '' : tabsHtml()) + sheetHtml() + (T.toast ? '<div class="toast" role="status">' + esc(T.toast) + '</div>' : '');
  var s = $('#screen'); if (s && keep) s.scrollTop = keep;
}

/* ---------- events ---------- */
var A = {
  go: function (d) { if (d.v === 'pause') audio(); if (d.v === 'notes') T.slipNote = false; go(d.v); },
  skip: function () { afterSplash(); },
  closesheet: function () { T.sheet = null; render(); },
  slipask: function () { T.sheet = 'slip'; render(); },
  slipdo: function () { recordSlip(); go('slip'); },
  steadier: function () { S.urges.push({ d: today() }); save(); go('passed'); },
  sound: function () { S.settings.sound = !S.settings.sound; save(); if (S.settings.sound) audio(); var b = $('[data-act=sound]'); if (b) { b.innerHTML = ic(S.settings.sound ? 'vol' : 'mute'); b.setAttribute('aria-label', S.settings.sound ? 'Turn sound off' : 'Turn sound on'); } },
  mood: function (d) { T.mood = d.m; render(); },
  savecheckin: function () {
    var note = (T.ci || '').trim(), mood = T.mood || 'steady';
    S.checkins[today()] = { mood: mood };
    if (note) S.notes.push({ id: String(Date.now()), d: today(), t: note });
    if (mood === 'slipped') recordSlip();
    save(); T.mood = null; T.ci = '';
    if (mood === 'slipped') go('slip'); else { go('today'); toast('Today is closed. Rest well.'); }
  },
  writeslip: function () { T.slipNote = true; go('notes'); },
  mo: function (d) { T.mo = Math.min(0, (T.mo || 0) + (+d.d)); render(); },
  pickq: function (d) { T.pi = +d.i; render(); },
  prompt: function () { T.pi = ((T.pi || 0) + 1) % PROMPTS.length; render(); },
  savenote: function () {
    var t = (T.nt || '').trim(); if (!t) return;
    S.notes.push({ id: String(Date.now()), d: today(), t: t }); save(); T.nt = ''; T.slipNote = false; render(); toast('Put down. You can leave it here.');
  },
  delnote: function (d) { S.notes = S.notes.filter(function (n) { return n.id !== d.id; }); save(); render(); },
  theme: function (d) { S.settings.theme = d.v; save(); render(); },
  snd: function (d) { S.settings.sound = d.v === 'on'; save(); render(); },
  setpin: function () { T.pinMode = 'set1'; T.pin = ''; T.pinMsg = ''; go('pin'); },
  rmpin: function () { S.settings.pin = null; save(); render(); toast('Code removed.'); },
  key: function (d) { if ((T.pin || '').length >= 4) return; T.pin = (T.pin || '') + d.k; T.pinMsg = ''; render(); if (T.pin.length === 4) timers.push(setTimeout(pinDone, 160)); },
  keyback: function () { T.pin = (T.pin || '').slice(0, -1); render(); },
  install: function () { if (!deferredInstall) return; deferredInstall.prompt(); deferredInstall = null; },
  export: function () {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'still-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
  },
  eraseask: function () { T.sheet = 'erase'; render(); },
  erasedo: function () { try { localStorage.removeItem(KEY); sessionStorage.clear(); } catch (e) {} S = fresh(); save(); T = {}; go('today'); toast('Cleared. A fresh start.'); }
};
function hashPin(p) { var h = 5381, s = 'still:' + p; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return String(h); }
function pinDone() {
  var p = T.pin; T.pin = '';
  if (T.pinMode === 'lock') {
    if (hashPin(p) === S.settings.pin) { try { sessionStorage.setItem('still.unlocked', '1'); } catch (e) {} go('today'); }
    else { T.pinMsg = 'That is not it. Try again.'; T.shake = true; render(); T.shake = false; }
  } else if (T.pinMode === 'set1') { T.pin1 = p; T.pinMode = 'set2'; T.pinMsg = ''; render(); }
  else { if (p === T.pin1) { S.settings.pin = hashPin(p); save(); try { sessionStorage.setItem('still.unlocked', '1'); } catch (e) {} go('settings'); toast('Code set.'); } else { T.pinMode = 'set1'; T.pinMsg = 'Those did not match. Start again.'; render(); } }
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('sheetbg') && e.target !== el) return;
  var fn = A[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener('input', function (e) { var b = e.target.dataset && e.target.dataset.bind; if (b) T[b] = e.target.value; });
document.addEventListener('change', function (e) {
  if (e.target.dataset && e.target.dataset.actChange === 'startdate' && e.target.value) {
    var v = e.target.value; if (v > today()) return;
    if (S.slips.length) { S.slips.pop(); S.slips.push(v); S.slips.sort(); } else S.start = v;
    save(); render(); toast('Count updated.');
  }
});
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render); } catch (e) {} }
document.addEventListener('keydown', function (e) {
  var el = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && el && el.getAttribute && el.getAttribute('data-act') === 'skip') { e.preventDefault(); afterSplash(); return; }
  if (e.key === 'Escape' && T.sheet) { T.sheet = null; render(); return; }
  if ((view === 'lock' || view === 'pin') && !e.metaKey && !e.ctrlKey) {
    if (/^[0-9]$/.test(e.key)) A.key({ k: e.key });
    else if (e.key === 'Backspace') A.keyback();
  }
});
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }

/* ---------- start ---------- */
var seen = false; try { seen = sessionStorage.getItem('still.splash') === '1'; } catch (e) {}
if (seen) { if (S.settings.pin && !isUnlocked()) { T.pinMode = 'lock'; T.pin = ''; view = 'lock'; } else view = 'today'; }
render();
</script>
</body>
</html>
